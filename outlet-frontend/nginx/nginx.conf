# Outlet frontend static server. Serves the built POS SPA and
# reverse-proxies API calls to this outlet's own backend container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolve at runtime so backend container
    # restarts (new IPs) never leave nginx with a stale upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API reverse proxy to the outlet backend container. Using a variable
    # makes nginx resolve through `resolver` per request instead of caching
    # the upstream IP at startup.
    location /api/ {
        set $outlet_api_upstream http://outlet-a-api:3000;
        proxy_pass $outlet_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routing handled by TanStack Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
